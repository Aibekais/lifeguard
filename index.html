<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeGuard — Төтенше жағдай тренажері</title>
<style>
:root{--bg:#0b1424;--panel:#141d2e;--panel2:#1b2638;--line:#27344a;--tx:#eef2f8;--mut:#93a1b8;--red:#e5322d;--blue:#4a8fe7;--ok:#37b26c;--warn:#f0a93b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#0b1424ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center}.logo i{width:22px;height:22px;border-radius:6px;background:var(--red);display:grid;place-items:center;font-style:normal;font-size:15px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}nav a{padding:6px 12px;border-radius:8px;color:var(--mut);font-size:14px}nav a.on,nav a:hover{background:var(--panel2);color:var(--tx)}
main{max-width:1100px;margin:auto;padding:24px 16px 60px}
h1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:0 0 16px;letter-spacing:-.02em}h2{margin:0 0 12px;font-size:26px}h3{margin:0 0 6px}
p{margin:0 0 12px;color:var(--mut)}
.btn{background:var(--red);color:#fff;border:0;padding:12px 20px;border-radius:10px;font-weight:700;display:inline-block}.btn.sec{background:transparent;border:1px solid var(--line);color:var(--tx)}.btn.sm{padding:7px 12px;font-size:14px}
.btn:hover{filter:brightness(1.1)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding:28px 0 40px}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 24px #0003}
.card.ill{padding:0;overflow:hidden}.card.ill .ic{height:110px;display:grid;place-items:center;font-size:46px;background:var(--panel2)}.card.ill .bd{padding:16px}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:var(--panel2);color:var(--mut);margin:0 6px 8px 0}.tag.r{background:#e5322d26;color:#ff8a86}
.stats{display:flex;gap:32px;flex-wrap:wrap;padding:24px 0;border-block:1px solid var(--line);margin:32px 0}.stats b{font-size:28px;display:block}.stats span{color:var(--mut);font-size:14px}
footer{border-top:1px solid var(--line);padding:24px 16px;text-align:center;color:var(--mut);font-size:13px}
.disc{border-left:3px solid var(--warn);background:#f0a93b14;padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:var(--tx);margin:16px 0}
.play{display:grid;grid-template-columns:1fr 280px;gap:16px}@media(max-width:860px){.play{grid-template-columns:1fr}}
.stage{background:#070d16;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;touch-action:none;min-height:280px}
#view3d{position:relative;min-height:min(68vh,560px)}
.stage svg{display:block;width:100%;height:auto}
.look-hint{position:absolute;inset:0;display:grid;place-items:center;background:#070d16a8;font-weight:700;pointer-events:none}
.alert{position:absolute;left:10px;right:10px;top:10px;background:#e5322dee;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;pointer-events:none;z-index:2}
.prompt{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2}
.hud{display:flex;flex-direction:column;gap:12px}
.meter{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);transition:width .2s}
.row{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.chk{font-size:14px;color:var(--mut);padding-left:0;list-style:none;margin:0}.chk li.d{color:var(--ok)}.chk li:before{content:"○ "}.chk li.d:before{content:"● "}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:16px}.modal .card{max-width:460px;width:100%}
.log{max-height:120px;overflow:auto;font-size:13px;color:var(--mut)}
.dpad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px}.dpad button{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:14px;font-size:20px;touch-action:none}@media(pointer:coarse),(max-width:860px){.dpad{display:grid}}
.q{margin-bottom:14px}.q button{display:block;width:100%;text-align:left;margin-top:6px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);padding:10px 12px;border-radius:10px}.q button.ok{border-color:var(--ok)}.q button.no{border-color:var(--red)}
select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
.fl{animation:fl .5s infinite alternate}@keyframes fl{to{transform:scale(1.18) translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.res-ok{color:var(--ok)}.res-bad{color:#ff8a86}
.big{font-size:64px;font-weight:800;line-height:1}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bars div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:4px;position:relative}.bars span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.badge{opacity:.35}.badge.on{opacity:1}
ul.l{margin:0;padding-left:18px;color:var(--mut)}ul.l li{margin-bottom:6px}
.auth{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
form.card label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}form.card input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:inherit}form .err{color:#ff8a86;font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#home"><i>+</i>LifeGuard</a>
<nav id="nav"><a href="#home">Басты бет</a><a href="#sims">Симуляциялар</a><a href="#ai">AI талдауы</a><a href="#dash">Кабинет</a><a href="#learn">Оқу орталығы</a></nav>
<div class="auth" id="authbox"></div>
</div></header>
<main id="app"></main>
<footer>LifeGuard — оқу симуляциясы. Бұл ресми төтенше нұсқаулық емес. Нақты төтенше жағдайда 112 нөміріне қоңырау шалыңыз.</footer>
<div id="modal"></div>
<script src="three.min.js"></script>
<script src="sim3d.js"></script>
<script>
const $=s=>document.querySelector(s),app=$("#app");
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function user(){return store.get("lg_user",null)}
function hashPass(p){let h=0;for(let i=0;i<p.length;i++)h=((h<<5)-h)+p.charCodeAt(i)|0;return "h"+h}
function authUI(){const u=user();$("#authbox").innerHTML=u?`<span>${u.name}</span> <a href="#profile">Профиль</a> <button class="btn sm sec" id="lo">Шығу</button>`:`<a class="btn sm sec" href="#login">Кіру</a> <a class="btn sm" href="#reg">Тіркелу</a>`;const lo=$("#lo");if(lo)lo.onclick=()=>{store.set("lg_user",null);authUI();route()}}
const SCEN=[
{id:"fire",ic:"🔥",t:"Өрт кезіндегі қауіпсіздік",d:"Пәтерде ас үйден түтін шығып жатыр. Қауіпсіз эвакуацияны орындаңыз.",df:"Орташа",du:"3 мин",on:1},
{id:"quake",ic:"🌐",t:"Жер сілкінісі",d:"Тербеліс кезінде қауіпсіз орынды таңдап, ғимараттан шығуды үйреніңіз.",df:"Орташа",du:"4 мин"},
{id:"gas",ic:"💨",t:"Газдың ағуы",d:"Газ иісін сезгенде не істеуге болады және не істеуге болмайды.",df:"Қиын",du:"4 мин"},
{id:"road",ic:"🚗",t:"Жол-көлік оқиғасы",d:"Апат орнында қауіпсіздікті сақтап, алғашқы көмек шақыру.",df:"Жеңіл",du:"3 мин"}];
const LESS=[
["Өрт: негізгі ережелер",["Дабыл қағыңыз, адамдарға хабарлаңыз.","Түтін болса еңкейіп немесе еңбектеп жүріңіз.","Лифтті пайдаланбаңыз, баспалдақпен түсіңіз.","Ас үй есігін жабу түтін мен отты баяулатады.","Қауіпсіз жерге шыққан соң 112-ге қоңырау шалыңыз."]],
["Жер сілкінісі: қысқаша",["Үстел астына жасырыныңыз, басыңызды қорғаңыз.","Терезеден, ауыр шкафтардан аулақ болыңыз.","Тербеліс аяқталған соң баспалдақпен шығыңыз."]],
["Газдың ағуы: қысқаша",["Ашық от жақпаңыз, ажыратқыштарды басмаңыз.","Терезелерді ашып, ғимараттан шығыңыз.","Қауіпсіз жерден газ қызметіне хабарлаңыз."]]];
const routes={home,sims,play,result,ai:result,dash,learn,login,reg,profile,reset};
function route(){const r=(location.hash||"#home").slice(1);stopLoop();closeModal();authUI();document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.hash==="#"+r||((r==="play")&&a.hash==="#sims")));(routes[r]||home)(r);scrollTo(0,0)}
addEventListener("hashchange",route);
function closeModal(){$("#modal").innerHTML=""}
function home(){app.innerHTML=`<section class="hero"><div><h1>Төтенше жағдайға дайынсың ба?</h1><p style="font-size:18px">Қауіпті жағдайларда дұрыс әрекет етуді қауіпсіз виртуалды ортада үйрен.</p>
<a class="btn" href="#play">Симуляцияны бастау</a> <a class="btn sec" href="#learn">Қалай жұмыс істейді?</a></div>
<div class="card" style="padding:0;overflow:hidden"><div class="stage" id="hero3d"></div></div></section>
<div class="stats"><div><b>4</b><span>сценарий (1 ойнауға дайын)</span></div><div><b>3D</b><span>пәтер ішінде жүру</span></div><div><b>0 ₸</b><span>демо-режим тегін</span></div></div>
<h2>Мүмкіндіктер</h2><div class="grid">
<div class="card"><h3>Пәтердің 3D іші</h3><p>Қонақ бөлме, ас үй, есіктер мен жиһаз. Түтін мен от әсерлері браузерде жұмыс істейді.</p></div>
<div class="card"><h3>Шешім жүйесі</h3><p>Әр әрекет жағдайды өзгертеді: қауіпті таңдау ұпайды төмендетеді және кері байланыс береді.</p></div>
<div class="card"><h3>Автоматты талдау</h3><p>Нәтиже ережеге негізделген жүйемен есептеледі. Нақты AI қосылмаған.</p></div></div>
<h2 style="margin-top:32px">Сценарийлер</h2><div class="grid">${SCEN.map(card).join("")}</div>`;
if(!(window.THREE&&Sim3D.startPreview($("#hero3d")))) $("#hero3d").innerHTML=scene(true)}
function card(s){return `<div class="card ill"><div class="ic">${s.ic}</div><div class="bd"><span class="tag">${s.df}</span><span class="tag">${s.du}</span><h3>${s.t}</h3><p>${s.d}</p>${s.on?'<a class="btn sm" href="#play">Бастау</a>':'<button class="btn sm sec" disabled>Жақында</button>'}</div></div>`}
function sims(){app.innerHTML=`<h2>Симуляциялар</h2><p>Өрт сценарийі 3D пәтерде толық ойнауға дайын. Қалғандары жақында қосылады.</p><div class="grid">${SCEN.map(card).join("")}</div>`}
function learn(){app.innerHTML=`<h2>Оқу орталығы</h2><div class="disc">Бұл материалдар оқу симуляциясына арналған. Ресми төтенше нұсқаулықты ТЖМ (112) сайттарынан тексеріңіз.</div><div class="grid">${LESS.map(l=>`<div class="card"><h3>${l[0]}</h3><ul class="l">${l[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div><h2 style="margin-top:32px">Қысқа викторина</h2><div id="quiz"></div>`;quiz()}
const QZ=[["Өрт кезінде лифтті пайдалануға бола ма?",["Иә, ол жылдам","Жоқ, баспалдақпен түсу керек","Тек түтін аз болса"],1,"Лифт тоқтап қалуы немесе түтінге толуы мүмкін."],["Түтінді жерде қалай жүру керек?",["Тік тұрып жүгіру","Еңкейіп немесе еңбектеп","Тыныс алмай тік жүру"],1,"Ыстық түтін жоғарыда жиналады, төменде ауа тазарақ."],["Үлкен өрт кезіндегі басты басымдық?",["Өртті өзіңіз сөндіру","Заттарды жинау","Эвакуация және 112"],2,"Өмір — басты құндылық. Сөндіруді құтқарушыларға қалдырыңыз."],["Газ иісі сезілсе, нені істеуге болмайды?",["Терезені ашу","Жарық қосқышын басу","Ғимараттан шығу"],1,"Электр ұшқыны газдың жарылуына себеп болуы мүмкін."],["Қауіпсіз жерге шыққан соң бірінші не істейсіз?",["Үйге қайта кіру","112-ге қоңырау шалу","Ештеңе істемей күту"],1,"Құтқарушыларға мекенжай мен жағдайды хабарлаңыз."]];
function quiz(){let sc=0,n=0;const el=$("#quiz");el.innerHTML=QZ.map((x,i)=>`<div class="card q"><b>${x[0]}</b>${x[1].map((o,j)=>`<button data-i="${i}" data-j="${j}">${o}</button>`).join("")}<p id="e${i}" style="margin:8px 0 0"></p></div>`).join("")+`<p id="qs" style="color:var(--tx);font-weight:700"></p>`;el.querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j,q=QZ[i],bs=el.querySelectorAll(`button[data-i="${i}"]`);if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add("ok");if(j!==q[2])b.classList.add("no");else sc++;n++;$("#e"+i).textContent=q[3];if(n===QZ.length)$("#qs").textContent=`Нәтиже: ${sc}/${QZ.length}`})}
function scene(preview){return `<svg viewBox="0 0 600 400" ${preview?'':'id="svg"'} role="img" aria-label="Пәтер жоспары">
<rect width="600" height="400" fill="#0e1727"/><rect x="20" y="20" width="360" height="360" fill="#1b2638"/><rect x="380" y="20" width="200" height="360" fill="#222c3f"/>
<path d="M20 20H580V380H20Z M380 20V240M380 300V380" fill="none" stroke="#5b6b86" stroke-width="6"/>
<rect x="14" y="270" width="12" height="60" fill="#4a8fe7"/><text x="34" y="262" fill="#93a1b8" font-size="12">Шығу</text>
<rect x="60" y="150" width="110" height="50" rx="8" fill="#3a4a66"/><text x="82" y="180" fill="#93a1b8" font-size="12">Диван</text>
<rect x="230" y="200" width="90" height="60" rx="6" fill="#33425c"/><text x="244" y="235" fill="#93a1b8" font-size="12">Үстел</text>
<rect x="150" y="305" width="40" height="26" rx="3" fill="#6b7a96"/><text x="140" y="348" fill="#93a1b8" font-size="11">Ноутбук</text>
<circle cx="200" cy="70" r="14" fill="#4a8fe7"/><text x="190" y="75" font-size="14">☎</text>
<circle cx="90" cy="70" r="14" fill="#f0a93b"/><text x="82" y="76" font-size="15">🔔</text>
<rect x="400" y="30" width="170" height="50" fill="#33425c"/><text x="440" y="60" fill="#93a1b8" font-size="12">Ас үй</text>
<g class="fl" style="transform-origin:490px 160px"><ellipse cx="490" cy="150" rx="40" ry="55" fill="#e5322d"/><ellipse cx="490" cy="165" rx="24" ry="36" fill="#f0a93b"/></g>
<rect id="smkL" x="20" y="20" width="360" height="360" fill="#6b7280" opacity="0"/><rect id="smkK" x="380" y="20" width="200" height="360" fill="#4b5260" opacity=".55"/>
<line id="kdoor" x1="380" y1="240" x2="380" y2="300" stroke="#f0a93b" stroke-width="8" opacity="0"/>
${preview?'':'<g id="pl"><circle r="14" fill="#fff"/><circle r="6" fill="#4a8fe7"/></g>'}</svg>`}

let G=null,raf=0,keys={},mode3d=true;
const OBJ=[{id:"alarm",x:90,y:70,l:"Өрт дабылын қағу"},{id:"phone",x:200,y:70,l:"112-ге қоңырау шалу"},{id:"close",x:370,y:270,l:"Ас үй есігін жабу"},{id:"laptop",x:170,y:318,l:"Ноутбукті алу"},{id:"extg",x:430,y:200,l:"Өртті сөндіруге тырысу"},{id:"exit",x:34,y:300,l:"Пәтерден шығу"}];
function stopLoop(){cancelAnimationFrame(raf);raf=0;G&&(G.run=false);if(window.Sim3D)Sim3D.dispose();removeEventListener("keydown",kd);removeEventListener("keyup",ku)}
function play(){
const df=store.get("lg_diff",1);G={dm:[.6,1,1.6][df],lim:[150,120,90][df],df,t:0,hp:100,smoke:0,crouch:false,x:250,y:250,tx:null,ty:null,acts:[],done:{},paused:false,run:true,closed:false,muted:false,msg:"Назар аударыңыз! Ас үйден түтін шығып жатыр.",stick:null,over:false};
app.innerHTML=`<div class="play"><div><div class="stage" id="stage"><div id="view3d"></div><div class="alert" id="alert"></div><div class="prompt" id="prompt"></div></div>
<p style="margin-top:10px;font-size:14px">3D: WASD + тінтуір. Әрекет: E. Еңкею: C. Шығу есігі — көк, ас үй — от жанып тұрған бөлме.</p>
<div class="dpad"><span></span><button data-k="w" aria-label="Жоғары">▲</button><span></span><button data-k="a" aria-label="Солға">◀</button><button id="dc" aria-label="Еңкею">🧎</button><button data-k="d" aria-label="Оңға">▶</button><span></span><button data-k="s" aria-label="Төмен">▼</button><span></span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><select id="df" aria-label="Қиындық деңгейі"><option value="0">Жеңіл</option><option value="1">Орташа</option><option value="2">Қиын</option></select><button class="btn sm sec" id="bP">⏸ Кідірту</button><button class="btn sm sec" id="bR">↻ Қайта бастау</button><button class="btn sm sec" id="bC">🧎 Еңкею: өшірулі</button><button class="btn sm sec" id="bS">🔊 Дыбыс</button></div></div>

<div class="card"><div class="row"><span>Уақыт</span><b id="tm">0:00</b></div><div class="row" style="margin-top:8px"><span>Денсаулық</span><b id="hpv">100</b></div><div class="meter"><i id="hpb"></i></div>

function reg(){app.innerHTML=`<h2>Тіркелу</h2><form class="card" id="f" style="max-width:420px"><label>Атыңыз</label><input name="name" required minlength="2"><label>Email</label><input type="email" name="email" required><label>Құпиясөз (кемінде 6 таңба)</label><input type="password" name="pass" required minlength="6"><p class="err" id="er"></p><button class="btn" type="submit">Тіркелу</button></form>`;
$("#f").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),name=String(fd.get("name")).trim(),email=String(fd.get("email")).trim().toLowerCase(),pass=String(fd.get("pass"));if(!email.includes("@")){$("#er").textContent="Email дұрыс емес.";return}if(pass.length<6){$("#er").textContent="Құпиясөз тым қысқа.";return}const users=store.get("lg_users",[]);if(users.some(x=>x.email===email)){$("#er").textContent="Бұл email бұрын тіркелген.";return}users.push({name,email,hash:hashPass(pass)});store.set("lg_users",users);store.set("lg_user",{name,email});location.hash="#dash"}}
function profile(){const u=user();if(!u){location.hash="#login";return}app.innerHTML=`<h2>Профиль</h2><div class="card" style="max-width:420px"><p><b style="color:var(--tx)">${u.name}</b></p><p>${u.email}</p><p>Нәтижелер осы құрылғыда сақталады.</p><a class="btn sec" href="#dash">Кабинет</a></div>`}
function reset(){app.innerHTML=`<h2>Құпиясөзді қалпына келтіру</h2><form class="card" id="f" style="max-width:420px"><label>Email</label><input type="email" name="email" required><label>Жаңа құпиясөз</label><input type="password" name="pass" required minlength="6"><p class="err" id="er"></p><button class="btn" type="submit">Жаңарту</button></form><p>Демо: бұл құрылғыдағы тіркелгіні жаңартады (сервер жоқ).</p>`;
$("#f").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),email=String(fd.get("email")).trim().toLowerCase(),pass=String(fd.get("pass"));const users=store.get("lg_users",[]);const i=users.findIndex(x=>x.email===email);if(i<0){$("#er").textContent="Мұндай email табылмады.";return}users[i].hash=hashPass(pass);store.set("lg_users",users);$("#er").textContent="";e.target.insertAdjacentHTML("beforeend",'<p class="res-ok">Құпиясөз жаңартылды. Енді кіріңіз.</p>')}}
route();
</script>
</body>
</html>
